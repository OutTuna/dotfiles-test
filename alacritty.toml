[terminal.shell]
program = "powershell"
args = ["-NoLogo"]

[font]
size = 14.0

[window.dimensions]
columns = 135
lines = 30

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[colors.primary]
background = "#131313"
foreground = "#d6dae4"

[colors.cursor]
cursor = "#b9b9b9"
text = "#131313"

[colors.selection]
text = "#131313"
background = "#1f1f1f"

[colors.normal]
black   = "#1f1f1f"
red     = "#f71118"
green   = "#2cc55d"
yellow  = "#ecb90f"
blue    = "#2a84d2"
magenta = "#4e59b7"
cyan    = "#0f80d5"
white   = "#d6dae4"

[colors.bright]
black   = "#d6dae4"
red     = "#de342e"
green   = "#1dd260"
yellow  = "#f2bd09"
blue    = "#0f80d5"
magenta = "#524fb9"
cyan    = "#0f7cda"
white   = "#ffffff"
